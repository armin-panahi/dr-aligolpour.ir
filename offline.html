<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#0f172a"
  >

  <title>بدون اتصال | دکتر علی گلپور</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: grid;
      place-items: center;

      padding: 24px;

      font-family:
        Tahoma,
        Arial,
        sans-serif;

      background: #0f172a;
      color: #ffffff;
    }

    .offline-card {
      width: min(100%, 520px);

      padding: 40px;

      text-align: center;

      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);

      border-radius: 28px;

      backdrop-filter: blur(20px);
    }

    .offline-icon {
      width: 88px;
      height: 88px;

      margin: 0 auto 24px;

      border-radius: 24px;

      object-fit: cover;
    }

    h1 {
      margin: 0 0 16px;
      font-size: 28px;
    }

    p {
      margin: 0 0 24px;

      line-height: 2;

      color: #cbd5e1;
    }

    button {
      border: 0;

      padding: 14px 24px;

      border-radius: 14px;

      background: #ffffff;
      color: #0f172a;

      font: inherit;
      font-weight: 700;

      cursor: pointer;
    }
  </style>
</head>

<body>

  <main class="offline-card">

    <img
      class="offline-icon"
      src="./images/dr-majid-aligolpour.PNG"
      alt="دکتر علی گلپور"
    >

    <h1>
      اتصال اینترنت برقرار نیست
    </h1>

    <p>
      در حال حاضر اتصال اینترنت در دسترس نیست.
      لطفاً اتصال خود را بررسی کنید و دوباره تلاش کنید.
    </p>

    <button onclick="location.reload()">
      تلاش دوباره
    </button>

  </main>

</body>
</html>
